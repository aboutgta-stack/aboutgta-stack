name: Extract cloud stack
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unzip.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site files
        run: |
          unzip -o cloud-stack.zip
          rm cloud-stack.zip
          rm -rf .github/workflows/unzip.yml
          ls -R
      - name: Commit extracted files
        run: |
          git config user.name "aboutgta-stack"
          git config user.email "thomus0011@gmail.com"
          git add -A
          git commit -m "Extract cloud stack site files"
          git push
